[project]
name = "xunji"
version = "0.1.0"
description = "瞬迹 — 基于 FPGA 并行时序分析的线束拓扑重建与动态互连瞬态诊断系统（主机侧工具链）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
xunji = "xunji.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xunji"]

[tool.pytest.ini_options]
testpaths = ["tests"]
