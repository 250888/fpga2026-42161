<circle cx="1017.6" cy="179.6" r="12.6" class="standoff"/>
<circle cx="1017.6" cy="179.6" r="4.7" class="pilot"/>
<text x="1017.6" y="155.8" class="dim" text-anchor="middle">(92,4)</text>
<circle cx="700.8" cy="496.4" r="12.6" class="standoff"/>
<circle cx="700.8" cy="496.4" r="4.7" class="pilot"/>
