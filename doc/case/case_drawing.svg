<text x="699.8" y="284.0" class="sub" text-anchor="end">JA</text>
<rect x="985.9" y="244.4" width="9.1" height="82.3" class="conn"/>
<text x="1009.4" y="284.0" class="sub" text-anchor="start">JB</text>
<line x1="751.2" y1="442.4" x2="967.2" y2="442.4" class="tprow"/>
<text x="859.2" y="436.6" class="sub" text-anchor="middle">TP1-16 (A)</text>
<line x1="751.2" y1="464.0" x2="967.2" y2="464.0" class="tprow"/>
<text x="859.2" y="458.2" class="sub" text-anchor="middle">TP17-32 (B)</text>
