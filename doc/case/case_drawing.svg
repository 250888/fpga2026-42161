<rect x="79.8" y="156.2" width="558.0" height="378.0" class="rim"/>
<text x="358.8" y="334.4" class="lbl" text-anchor="middle">EGO1 舱位 150×100</text>
<text x="358.8" y="366.8" class="sub" text-anchor="middle">围边内腔 151×101（单边 0.5 间隙）</text>
<rect x="686.4" y="165.2" width="345.6" height="345.6" class="fe" stroke-dasharray="6 4"/>
