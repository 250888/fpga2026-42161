<rect x="600.0" y="687.2" width="14.4" height="10.8" class="tie"/>
<text x="607.2" y="714.2" class="dim" text-anchor="middle">绑扎孔</text>
<rect x="924.0" y="687.2" width="14.4" height="10.8" class="tie"/>
<text x="931.2" y="714.2" class="dim" text-anchor="middle">绑扎孔</text>
<rect x="60.0" y="237.2" width="10.8" height="28.8" class="vent"/>
<rect x="60.0" y="316.4" width="10.8" height="28.8" class="vent"/>
<rect x="60.0" y="395.6" width="10.8" height="28.8" class="vent"/>
<rect x="60.0" y="474.8" width="10.8" height="28.8" class="vent"/>
<circle cx="103.2" cy="93.2" r="14.4" class="foot"/>
<circle cx="1053.6" cy="93.2" r="14.4" class="foot"/>
<circle cx="103.2" cy="654.8" r="14.4" class="foot"/>
<circle cx="1053.6" cy="654.8" r="14.4" class="foot"/>
<line x1="60.0" y1="741.2" x2="1096.8" y2="741.2" class="dimline"/>
<text x="578.4" y="755.6" class="dim" text-anchor="middle">总宽 288</text>
<line x1="1140.0" y1="50.0" x2="1140.0" y2="698.0" class="dimline"/>
<text x="1158.0" y="374.0" class="dim" text-anchor="middle">总深 180</text>
<line x1="700.8" y1="626.0" x2="1017.6" y2="626.0" class="dimline"/>
<text x="859.2" y="611.6" class="dim" text-anchor="middle">88.0</text>
<line x1="1075.2" y1="179.6" x2="1075.2" y2="496.4" class="dimline"/>
<text x="1057.2" y="338.0" class="dim" text-anchor="end">88.0</text>
<rect x="60" y="732.0" width="14" height="10" class="outer"/>
<text x="80" y="741.0" class="lg">外壳外框</text>
<rect x="60" y="748.0" width="14" height="10" class="cavity"/>
<text x="80" y="757.0" class="lg">内腔</text>
<rect x="60" y="764.0" width="14" height="10" class="standoff/pilot"/>
<text x="80" y="773.0" class="lg">M3 柱 / 底孔 2.6</text>
<rect x="60" y="780.0" width="14" height="10" class="open"/>
<text x="80" y="789.0" class="lg">开口</text>
<rect x="60" y="796.0" width="14" height="10" class="tie"/>
<text x="80" y="805.0" class="lg">绑扎孔</text>
<rect x="60" y="812.0" width="14" height="10" class="vent"/>
